[["*3년 전 사고의 사망자: 김동현 / 한동민 / 박성호 / 기록 없음.*","박성호|……이거 나잖아.","명재현|뭐가?","박성호|사고 기록에 내 이름이 있어.","명재현|야, 장난하지 마.","박성호|나도 장난이면 좋겠거든."],[["사고 기록을 원래대로 복구한다",3,1],["자신의 이름을 지운다","e:sh1"],["사고 기록을 그대로 둔다",3,0,0,null,"lost:한동민"]]],
[["@한동민|*보건실 기록의 사망자가 한동민으로 바뀌어 있다. 한동민의 자리는 비어 있고 아무도 그를 기억하지 못한다.*","박성호|기록이 바뀔 때마다 사람이 사라지지?","김동현|성호 형. 그만 찾아. 형까지 사라지는 건 싫어.","박성호|……너는 대체 누구야?","*동현은 3년 전 사고로 죽었다고 일부만 말한다. 성호는 믿지 않는다. 귀신보다 기록이 왜 사건을 바꾸는지가 먼저다.*"],[["창고에서 원본 기록을 찾는다",4,1]]],
[["*원본: 22:30 자습 종료 / 22:40 퇴실 방송 / 22:45 사고 발생 / 23:00 기록 종료.*","*손글씨: 이 기록을 수정하면 다음 밤이 시작된다. 하지만 원본을 복구하면 기록은 끝난다.*"],[["마지막 기록을 복구한다",5,0]]],
[["*성호는 마지막 기록을 복구할 기회를 얻는다. (모든 기록을 모으고 사고 기록을 복구해야 4번이 열린다)*"],[["자신의 이름을 확인자로 남긴다","e:sh2"],["동현의 이름을 확인자로 남긴다","e:sh3"],["확인자를 공란으로 둔다","e:sh1"],["여섯 명의 이름을 모두 퇴실 완료로 기록한다","e:shT",0,4]]]],
e:{sh1:["잘못된 수정","잘못 고친 기록 속에서 성호의 이름이 지워진다. 일지에는 다섯 명의 이름만 남고 아무도 성호를 기억하지 못한다."],sh2:["원본의 주인","성호가 확인자로 남아 친구들은 나가지만 성호는 학교에 갇힌다. 기록 확인자: 박성호."],sh3:["마지막 증거","다섯 명이 탈출하고 동현은 학교에 남는다. 성호의 손에는 동현의 이름이 적힌 마지막 증거가 쥐어져 있다."],shT:["기록되지 않은 이름","명재현|야, 이제 진짜 끝난 거야?~박성호|그런 것 같은데.~김운학|형, 이번에는 맞는 거죠?~박성호|응. 이번에는 틀린 기록 없어.~*성호는 일지를 덮는다. 기록 확인자: 박성호.*~박성호|적어도 이번에는 내가 직접 확인했으니까."]}},
명재현:{n:"여섯 번째 이름",dg:"jh2",s:[
[["*방송: 현재 학교에 남아 있는 학생은 총 6명입니다. 22:40.*","명재현|야, 우리 전에 이거 해본 적 있지 않냐?","박성호|뭘?","명재현|아니…… 그냥. 뭔가 익숙해서.","김운학|형 요즘 피곤한가 봐요.","김동현|……그럴 수도 있지.","*동현만 재현을 바라보다가 시선을 피한다.*"],[["교무실로 간다",1,0,0,null,"lost:김운학"]]],
[["*일지를 보던 사이 운학이 사라졌다. 문자: 형들 저 지금 4층인데요. 여기가 어디예요? 형들 목소리가 들려요.*"],[["운학의 목소리가 들리는 4층으로 간다",2,0,0,null,"lost:박성호"],["방송실 통신 기록부터 확인한다",2,1,0,null,"lost:박성호"],["동현에게 운학의 행방을 묻는다",2,1,0,null,"lost:박성호"]]],
[["@김운학|*운학이 있던 자리에는 빈 책가방만 남아 있다.*","*성호도 사라졌다. 도서관 메모: 이름이 지워진 학생은 사라지는 게 아니다. 처음부터 존재하지 않았던 것처럼 바뀐다. 성호 휴대폰 사진 속 성호의 얼굴만 흐릿하다.*"],[["성호의 메모를 따라간다",3,1],["졸업앨범을 확인한다",3,1],["성호가 있던 교실을 조사한다",3,0]]],
[["한동민|재현 형. 우리 중에 이미 죽은 사람이 있는 것 같아.","명재현|그게 무슨 소리야?","한동민|동현이가…","*뒤에서 동현의 목소리가 동민을 부른다. 불이 꺼졌다 켜지자 동민은 없다.*","!2|*사고 기록: 11월 5일 한동민 22:45 퇴실 기록 없음. 단서가 부족해 동민은 사망 처리된다.*","?2|*난간에 동민의 휴대폰이 있다. 단서 덕에 동민이 끌려간 방향을 알아냈다. 아직 살아 있다.*"],[["동현을 추궁한다",4,0,0,null,"lost<2:한동민"]]],
[["@한동민|*동민의 자리도 비어 있다. 남은 건 넷뿐이다.*","명재현|너 알고 있지? 애들 어디 있는지.","김동현|재현 형. 나 믿어주면 안 돼?","명재현|지금 그게 중요해?"],[["동현을 믿는다",5,1],["동현을 의심한다",5,0]]],
[["*4층의 낡은 일지. 다섯 명의 퇴실 시간만 있고 동현만 공란이다. 이번에도 다섯 명만 나갈 수 있다. 마지막 한 명은 남아야 한다.*","*동현이 나타나 자신이 3년 전 사고로 죽었고 반복되는 밤에서 친구들을 구하려 했다고 밝힌다.*"],[["마지막 선택으로",6,0,0,null,"found3:김운학,found3:박성호"]]],
[["^김운학|*단서로 찾아낸 4층 방에서 운학과 성호가 정신을 잃은 채 발견된다. 둘 다 살아 있다.*","*재현이 선택해야 한다. (단서 3개 이상이면 1번이 열린다)*"],[["동현을 믿고 기록을 복구한다","e:jhT",0,3],["동현을 데리고 무조건 탈출한다","e:jh2"],["기록을 불태우고 학교를 나간다","e:jh3"],["친구들을 먼저 보내고 혼자 남는다","e:jh4"]]]],
e:{jhT:["여섯 번째 이름","*퇴실 학생: 박성호, 명재현, 이상혁, 한동민, 김운학. 미퇴실 학생이던 김동현의 칸이 채워진다. 기록 확인자: 명재현.*~명재현|다음에는…… 너도 같이 나가자."],jh2:["다섯 명의 생존","동현을 끌고 나가려는 순간 문턱에서 동현만 사라진다. 다섯 명은 살아 나오고 동현은 실종된다."],jh3:["불탄 기록","재가 흩날리고 교문이 다시 닫힌다. 여섯 명 모두 밤에 갇힌다."],jh4:["혼자 남은 재현","친구들을 먼저 보낸 재현은 4층 계단에 남는다. 아침, 일지의 확인자 칸에 재현의 이름이 번져 있다."]}},
한동민:{n:"응답하지 않은 목소리",dg:"dm3",s:[
[["*22:50 교실. 복도에서 재현의 목소리가 들린다.*","명재현|동민아. 빨리 나와.","한동민|어? 형 어디 있어?","명재현|여기. 복도 끝.","*휴대폰이 울린다. 재현의 메시지: 동민아, 지금 어디야? 우리 아직 교실 앞이야.*"],[["문밖의 목소리는 재현이 아니다. 열지 않는다",1,1],["문을 연다","e:dm1"]]],
[["*벽 메모(이전 반복의 동민이 남김): 이름을 부르는 목소리에 대답하지 말 것 / 혼자 있는 곳을 알려 주면 따라가지 말 것 / 방송 퇴실 안내에 응답하지 말 것 / 목소리가 두 번 반복되면 그 자리를 떠날 것.*"],[["복도로 나간다",2,0]]],
[["김동현|동민아, 나 좀 도와줘.","한동민|너 어디 있어?","김동현|4층.","한동민|……우리 학교 3층까지잖아.","김동현|이번에는 다르잖아.","*진짜 동현은 항상 먼저 말을 걸고, 가짜는 이름을 부르며 대답을 유도한다.*"],[["가짜다. 대답하지 않는다",3,1],["구하러 4층으로 간다","e:dm1"]]],
[["*방송실 녹음 속 동민의 목소리: 이 녹음을 듣고 있다면 이번에도 실패한 거겠지. 무서워도 대답하지 마. 네가 듣는 목소리는 네 친구들이 아니야. 그리고 동현이를 찾아.*"],[["보건실로 간다",4,1]]],
[["*보건실 사고 기록에 동민이 사망한 것으로 적혀 있다. 복도에서 운학의 목소리: 동민이 형! 형, 저 혼자예요.*"],[["목소리를 따라간다","e:dm1"],["녹음의 규칙대로 다른 경로로 이동한다",5,1,0,null,"lost:김운학"],["방송실에서 친구들의 위치를 확인한다",5,1]]],
[["@김운학|*운학의 목소리는 더 들리지 않는다. 방송실 기록에서 운학의 칸이 비어 있다.*","한동민|나 사실 무서웠어. 계속 괜찮은 척했는데 진짜 무서웠다고. 근데 이번에는 도망 안 갈래.","김동현|미안해. 그 목소리들이 너를 부른 이유를 알아. 너를 마지막으로 남기려고 했던 거야.","*동현은 동민이 이전 반복에서 여러 번 혼자 남았다고 알려 준다.*"],[["방송실로 간다",6,0]]],
[["*마지막 방송. 마이크가 묻는다. 퇴실하지 않은 학생의 이름을 말해라.*"],[["현재 남아 있는 모든 학생의 퇴실을 확인합니다. 퇴실하지 않은 학생은 없습니다.","e:dmT",0,3],["이름을 말한다","e:dm1"],["침묵하고 다섯 명만 데리고 나간다","e:dm3"],["혼자 방송실을 빠져나간다","e:dm2"]]]],
e:{dm1:["대답한 사람","목소리에 대답한 순간 복도의 불이 꺼진다. 일지에서 한동민의 이름이 번지며 지워진다."],dm2:["마지막 방송","동민만 학교를 빠져나온다. 뒤돌아본 창문에서 친구들이 손을 흔든다. 아무도 따라 나오지 않는다."],dm3:["침묵의 탈출","다섯 명이 탈출하고 동현은 남는다. 동민은 끝까지 입을 열지 않은 자신이 처음으로 대견하다."],dmT:["응답하지 않은 목소리","명재현|야, 너 왜 이렇게 늦었어?~한동민|……그냥 좀 일이 있었어.~김운학|형 무서웠어요?~한동민|어. 엄청.~김운학|근데 어떻게 나왔어요?~한동민|무서워도 나와야지.~*동민이 뒤를 돌아본다. 학교 안에서 더 이상 아무 목소리도 들리지 않는다.*"]}},
김동현:{n:"한 명이라도",dg:"dh4",s:[
[["*22:30. 동현은 혼자 교실에 앉아 있다. 오늘 밤 무슨 일이 일어날지 알고 있다.*","김동현|이번에는…… 다르게 해보자. 한 명이라도 좋으니까. 이번에는 꼭 나가게 해줄게.","*(첫 번째 밤에는 다 같이 나갈 수 있을 줄 알았다. 다섯 번째 밤에는 한 명이라도 구하고 싶어졌다.)*","*복도에서 친구들의 웃음소리가 들린다. 아직은 평소와 같은 밤이다.*"],[["구출 대상을 정한다",1,0]]],
[["*누구를 구할 것인가. 한번 정하면 바꿀 수 없다.*","*(다섯 명. 하지만 이번 밤에 구할 수 있는 건 한 명뿐이다.)*","*(누구를 고르든 나머지의 얼굴을 오래 기억하게 될 거야.)*"],[["박성호",2,0,0,0],["명재현",3,0,0,1],["이상혁",4,0,0,2],["한동민",5,0,0,3],["김운학",6,0,0,4]]],
[["*성호 형은 기록을 꼼꼼히 확인하다 과거 사고 기록을 발견할 것이다. 진실을 너무 일찍 알면 4층으로 향한다.*"],[["성호 형이 발견한 기록을 회수하고 교무실로 유도한다",7,1,0,null,"trust+1"],["그냥 둔다","e:dhF"]]],
[["*재현 형은 친구가 사라질 때마다 직접 찾으러 간다.*"],[["재현 형이 혼자 움직이지 않게 설득하고 친구들을 분산시키지 않는다",7,1,0,null,"trust+1"],["재현을 혼자 보낸다","e:dhF"]]],
[["*상혁 형은 눈치가 빠르다. 동현이 사건을 미리 안다는 걸 이미 알아챘다.*"],[["한꺼번에 말하지 않고 필요한 기록부터 보여준다",7,1,0,null,"trust+1"],["모든 걸 숨긴다","e:dhF"]]],
[["*동민은 무서움을 숨기며 친구들 곁을 떠나지 못한다.*"],[["혼자 행동하지 말라고 말하고 방송실의 나가는 경로를 확보한다",7,1,0,null,"trust+1"],["방송실로 혼자 보낸다","e:dhF"]]],
[["*운학은 반복되는 밤을 어렴풋이 기억한다.*"],[["진실을 숨기지 않고 함께 기록을 확인한다",7,1,0,null,"trust+1"],["운학을 속여 먼저 내보내려 한다","e:dhF"]]],
